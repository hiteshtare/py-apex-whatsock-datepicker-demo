<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML, CSS, & JS Page</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- CSS Styling goes inside the <style> tag within the <head> -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9 !important;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333333 !important;
            padding-top: 30px !important;
            font-size: 30px !important;
        }

        button {
            background-color: #007bff !important;
            color: white !important;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3 !important;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #28a745 !important;
        }

        select, label, input[type="text"] {
          font-size: large !important;
        }

        .accCalendar {
          max-height: 32px !important;
          max-width: 32px !important;
          background-color: gray !important;
        }

        .imgCalendar {
         max-height: 28px !important;
          max-width: 28px !important;
        }

    </style>
</head>
<body> <!-- The <body> tag contains everything visible on the webpage -->
  <h1>Welcome to Datepicker Demo</h1>
  <label for="input_54_15">Purpose:</label>
  <select name="input_15" id="input_54_15" class="medium gfield_select" aria-required="true" aria-invalid="false"><option value="Individual Retreat" selected="selected">Individual Retreat</option><option value="Group Retreat">Group Retreat</option><option value="Aug 22 - 23: When Will God Come to You?">Aug 22 - 23: When Will God Come to You?</option><option value="Sep 19 - 20: Living the Divine Existence God Planned for You">Sep 19 - 20: Living the Divine Existence God Planned for You</option><option value="Oct 24 - 25: Self-realization: Knowing Your Infinite Nature">Oct 24 - 25: Self-realization: Knowing Your Infinite Nature</option><option value="Nov 28 - 29: Follow the Path of Great Ones">Nov 28 - 29: Follow the Path of Great Ones</option><option value="Dec 26 - 27: How to Attune with Universal Kutastha Consciousness">Dec 26 - 27: How to Attune with Universal Kutastha Consciousness</option></select>


  <div>

&nbsp;

    <img class="imgCalendar" src="../Templates/Datepickers/Basic/img/calendar-button.svg" alt="Calendar" title="Calendar" />
  </button>
</div>
